# Page: cruise
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: cruise
label: Cruise
icon: cruise_control
order: 2
remote_configurable: true
description: Longitudinal control, speed limits, and cruise behavior
sections:
- id: core_cruise_features
  title: ''
  description: ''
  items:
  - key: DisengageOnAccelerator
    widget: toggle
    title: Disengage Cruise on Accelerator Pedal
    description: When enabled, pressing the accelerator pedal will disengage longitudinal control.
  - key: LongitudinalPersonality
    widget: multiple_button
    title: Driving Personality
    description: Standard is recommended. In aggressive mode, sunnypilot will follow lead cars closer and be more aggressive
      with the gas and brake. In relaxed mode sunnypilot will stay further away from lead cars. On supported cars, you can
      cycle through these personalities with your steering wheel distance button.
    options:
    - value: 0
      label: Aggressive
    - value: 1
      label: Standard
    - value: 2
      label: Relaxed
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: AccelBoostSP
    widget: toggle
    title: Acceleration Boost
    description: "Adds a small push on top of sunnypilot's own acceleration, stronger in Aggressive and gentler in Relaxed. Eases off in curves and when sunnypilot slows or stops. Never goes past your set speed, and lead-car following still comes first."
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: IntelligentCruiseButtonManagement
    widget: toggle
    title: Intelligent Cruise Button Management (ICBM) (Alpha)
    visibility:
    - type: capability
      field: icbm_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - type: not
      condition:
        type: capability
        field: has_longitudinal_control
        equals: true
- id: custom_acc_increments
  title: Custom ACC Speed Intervals
  description: ''
  enablement:
  - $ref: '#/macros/offroad'
  - type: any
    conditions:
    - type: all
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: not
        condition:
          type: capability
          field: pcm_cruise
          equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: CustomAccIncrementsEnabled
    widget: toggle
    title: Enable Custom ACC Speed Intervals
    enablement:
    - $ref: '#/macros/offroad'
    - type: any
      conditions:
      - type: all
        conditions:
        - type: capability
          field: has_longitudinal_control
          equals: true
        - type: not
          condition:
            type: capability
            field: pcm_cruise
            equals: true
      - type: capability
        field: has_icbm
        equals: true
  sub_panels:
  - id: custom_acc_intervals
    label: Custom ACC Speed Intervals Settings
    trigger_key: CustomAccIncrementsEnabled
    trigger_condition:
      type: param
      key: CustomAccIncrementsEnabled
      equals: true
    items:
    - key: CustomAccShortPressIncrement
      widget: option
      title: Short Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
    - key: CustomAccLongPressIncrement
      widget: option
      title: Long Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
- id: speed_limits
  title: Speed Limits
  description: Speed limit detection, offset behavior and Smartspeed
  items:
  - key: SpeedLimitMode
    widget: multiple_button
    title: Speed Limit Assist Mode
    description: >-
      Smartspeed: the brain, the neural network that watches the road, chooses the speed. The cruise button only turns
      it on and off: the car drives at the speed the brain knows, also above the set speed, and + and - do nothing: the
      word SMART blinks to say so. Without a reading the map speed applies, and curves still slow the car down.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Information
    - value: 2
      label: Warning
    - value: 3
      label: Assist
      enablement:
      - type: any
        conditions:
        - type: capability
          field: has_longitudinal_control
          equals: true
        - type: capability
          field: has_icbm
          equals: true
      - type: not
        condition:
          type: capability
          field: brand
          equals: rivian
      - type: not
        condition:
          type: all
          conditions:
          - type: capability
            field: brand
            equals: tesla
          - type: capability
            field: is_sp_release
            equals: true
    - value: 4
      label: Smartspeed
      enablement:
      - type: any
        conditions:
        - type: capability
          field: has_longitudinal_control
          equals: true
        - type: capability
          field: has_icbm
          equals: true
      - type: not
        condition:
          type: capability
          field: brand
          equals: rivian
      - type: not
        condition:
          type: all
          conditions:
          - type: capability
            field: brand
            equals: tesla
          - type: capability
            field: is_sp_release
            equals: true
  - key: SpeedLimitPolicy
    widget: multiple_button
    title: Speed Limit Source
    description: "Smartspeed: only the speed-limits neural network's limit from the road camera, never the map. The
      Smartspeed mode uses it by itself."
    options:
    - value: 0
      label: Car State Only
    - value: 1
      label: Map Data Only
    - value: 2
      label: Car State Priority
    - value: 3
      label: Map Data Priority
    - value: 4
      label: Combined
    - value: 6
      label: Smartspeed
    visibility:
    - type: param_compare
      key: SpeedLimitMode
      op: '<'
      value: 4
  - key: SpeedLimitVisionDisplay
    widget: toggle
    title: Show Vision Reading
    description: Show what the network reads from the road camera, in a fuchsia square on the right of the driving
      screen. Information only, it does not change the speed. A dark square with a dash means no reading. Always shown
      with the Smartspeed mode, and when Speed Limit Source is Smartspeed.
    visibility:
    - {type: capability, field: device_type, equals: mici}
    - type: param_compare
      key: SpeedLimitMode
      op: '<'
      value: 4
  - key: SpeedLimitOffsetType
    widget: multiple_button
    title: Offset Type
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Fixed
    - value: 2
      label: Percentage
  - key: SpeedLimitValueOffset
    widget: option
    title: Offset Value
    min: -30
    max: 30
    step: 1
    unit:
      metric: km/h
      imperial: mph
    visibility:
    - type: param_compare
      key: SpeedLimitOffsetType
      op: '>'
      value: 0
- id: smart_cruise
  title: Smart Cruise Control
  description: ''
  enablement:
  - type: any
    conditions:
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: SmartCruiseControlVision
    widget: toggle
    title: Vision
    description: Use vision path predictions to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
  - key: SmartCruiseControlMap
    widget: toggle
    title: Map
    description: Use map data to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
